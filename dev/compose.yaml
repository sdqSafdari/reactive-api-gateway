services:
  postgres:
    container_name: postgres
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres:/var/lib/postgresql/

  keycloak:
    container_name: keycloak
    image: keycloak/keycloak:26.6
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_HOSTNAME: localhost
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    command: start-dev

  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: wiremock-server
    ports:
      - "7878:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command:
      - "--global-response-templating"
      - "--disable-gzip"
    environment:
      - WIREMOCK_OPTIONS=--verbose
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:3-amd64
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      # STORAGE_TYPE=mem is actually the default, but set explicitly for clarity.
      # Traces live only in the container's memory and are lost on restart —
      # fine for local dev/testing, not for production.
      - STORAGE_TYPE=mem
      - JAVA_OPTS=-Xms512m -Xmx512m
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC — point your Spring app here
      - "4318:4318"   # OTLP HTTP — or here, if using HTTP transport
    depends_on:
      - zipkin
      - elasticsearch
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # local dev only — enable + add api_key auth for anything real
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"


  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  postgres:
  prometheus_data:
  esdata01: